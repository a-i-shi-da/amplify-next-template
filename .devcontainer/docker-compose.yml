services:
  app:
    image: node:22
    container_name: app
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - next-cache:/workspace/.next
      - node-modules:/workspace/node_modules
    command: sleep infinity
    user: node
    ports:
      - "3000:3000"

volumes:
  next-cache:
  node-modules: